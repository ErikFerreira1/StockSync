services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stocksync}
      POSTGRES_USER: ${POSTGRES_USER:-stocksync}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stocksync-demo-db}

    ports:
      - "${POSTGRES_PORT:-5432}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stocksync} -d ${POSTGRES_DB:-stocksync}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-demo}
      POSTGRES_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-stocksync}
      POSTGRES_USER: ${POSTGRES_USER:-stocksync}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stocksync-demo-db}
      SHOW_SQL: ${SHOW_SQL:-false}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
      JWT_SECRET: ${JWT_SECRET:-demo-only-jwt-secret-with-at-least-32-bytes}
      DEMO_USERNAME: ${DEMO_USERNAME:-demo}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-stocksync-demo}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-admin}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-change-this-admin-password}
      MERCADO_LIVRE_REDIRECT_URI: ${MERCADO_LIVRE_REDIRECT_URI:-https://example.invalid/mercadolivre/callback}
    ports:
      - "${APP_PORT:-8080}:8080"

volumes:
  postgres_data:
