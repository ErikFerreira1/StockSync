app.demo.enabled=true
app.demo.data.enabled=true
app.demo.username=${DEMO_USERNAME:demo}
app.demo.password=${DEMO_PASSWORD:stocksync-demo}

app.bootstrap.admin.enabled=false
app.mercadolivre.redirect-uri=https://example.invalid/mercadolivre/callback
app.mercadolivre.oauth-cookie-secure=false

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
springdoc.paths-to-exclude=/integration-credentials/**,/mercadolivre/**,/users/**
