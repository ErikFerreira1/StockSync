name: StockSync CI

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Interface web
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v6

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Testar interface
        run: npm test

      - name: Verificar tipos e gerar build
        run: npm run build

  build-and-test:
    name: Compilação e testes
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v6

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Compilar, testar e gerar cobertura
        run: ./mvnw --batch-mode --no-transfer-progress verify

      - name: Salvar relatórios dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-de-testes
          path: |
            target/surefire-reports/
            target/site/jacoco/
          retention-days: 7

      - name: Verificar a construção da imagem Docker
        run: docker build -t stocksync:ci .
